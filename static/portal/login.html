<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>账户登录 · 数据编织平台</title>
<link rel="stylesheet" href="/static/portal/login.css?v=0.1.34">
</head>
<body>
<main class="login-shell">
 <section class="login-card" aria-labelledby="login-title">
  <a class="brand" href="/static/portal/login.html"><span class="brand-mark"><i></i><i></i><i></i><i></i></span><span>数据编织平台<small>DATA WORKSPACE</small></span></a>
  <p class="eyebrow">ACCOUNT ACCESS</p><h1 id="login-title">登录工作空间</h1>
  <p class="intro">登录后，目录、图谱、查询和服务会按你的账户等级显示。</p>
  <form id="login-form">
   <label>账号<input id="username" name="username" autocomplete="username" required maxlength="40" autofocus></label>
   <label>密码<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"></label>
   <p class="error" id="login-error" role="alert"></p>
   <button class="primary" type="submit" id="login-submit">登录</button>
  </form>
  <div class="auth-switch" id="login-switch">还没有账户？<button class="text-button" type="button" id="show-register">直接注册</button></div>
  <form id="register-form" hidden>
   <label>显示名称<input id="register-display-name" name="name" autocomplete="name" required maxlength="80" placeholder="你希望平台如何称呼你"></label>
   <label>设置账号<input id="register-username" name="username" autocomplete="username" required minlength="3" maxlength="40" pattern="[A-Za-z0-9][A-Za-z0-9_.-]{2,39}" placeholder="3–40位字母、数字、点、下划线或连字符"></label>
   <label>设置密码<input id="register-password" name="new-password" type="password" autocomplete="new-password" required minlength="10" maxlength="128"></label>
   <label>再次输入密码<input id="register-confirm-password" name="confirm-password" type="password" autocomplete="new-password" required minlength="10" maxlength="128"></label>
   <p class="register-note">新账户注册后默认为1级，可直接登录；权限范围由平台管理员维护。</p>
   <p class="error" id="register-error" role="alert"></p>
   <button class="primary" type="submit" id="register-submit">创建账户并进入平台</button>
  </form>
  <div class="auth-switch" id="register-switch" hidden>已有账户？<button class="text-button" type="button" id="show-login">返回登录</button></div>
  <form id="change-form" hidden>
   <div class="notice">这是首次登录临时密码，请先设置新密码。</div>
   <label>新密码<input id="new-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
   <label>再次输入新密码<input id="confirm-password" type="password" autocomplete="new-password" minlength="10" maxlength="128" required></label>
   <p class="error" id="change-error" role="alert"></p>
   <button class="primary" type="submit">保存新密码</button>
  </form>
  <p class="footnote">权限等级由平台管理员维护；每次访问均按账户权限核验。</p>
 </section>
</main>
<script type="module" src="/static/portal/login.js?v=0.1.34"></script>
</body></html>
